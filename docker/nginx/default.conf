server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 12m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Resolve the current app container after recreation without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_backend app:9000;
    set $reverb_backend reverb:8080;

    # Only the WebSocket handshake is public; the signed /apps API stays in Docker.
    location ~ ^/app/[A-Za-z0-9_-]+$ {
        proxy_pass http://$reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location /build/assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass $php_backend;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
}
